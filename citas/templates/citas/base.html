<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Recepción | Huellas Sanas{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18332e;
            --muted: #6c7d78;
            --green: #18745c;
            --green-dark: #105b48;
            --mint: #e8f4ef;
            --line: #e3ebe7;
            --surface: #fff;
            --background: #f5f8f6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        a { color: inherit; text-decoration: none; }
        .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
        .topbar-inner {
            max-width: 1120px; min-height: 72px; margin: auto; padding: 0 24px;
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -.03em; }
        .brand-mark {
            width: 38px; height: 38px; border-radius: 12px; background: var(--mint);
            color: var(--green); display: grid; place-items: center; font-size: 20px;
        }
        .brand small { display: block; color: var(--muted); font-size: 11px; font-weight: 550; letter-spacing: .04em; }
        .nav { display: flex; align-items: center; gap: 24px; font-size: 14px; font-weight: 600; }
        .nav a { color: #52645f; }
        .nav a:hover, .nav a.active { color: var(--green); }
        main { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }
        .eyebrow { color: var(--green); font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .11em; }
        h1 { margin: 8px 0 8px; font-size: clamp(28px, 4vw, 36px); letter-spacing: -.045em; }
        .subtitle { margin: 0; color: var(--muted); }
        .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
        .button {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            min-height: 44px; border: 0; border-radius: 10px; padding: 0 16px;
            background: var(--green); color: white; font: inherit; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: background .15s ease;
        }
        .button:hover { background: var(--green-dark); }
        .button.secondary { background: white; border: 1px solid var(--line); color: var(--ink); }
        .button.secondary:hover { background: var(--mint); }
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 5px 20px #163b2e08; }
        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
        .toolbar h2 { margin: 0; font-size: 16px; }
        .date-form { display: flex; align-items: center; gap: 10px; }
        input, select, textarea {
            width: 100%; min-height: 44px; border: 1px solid #d6e1dc; border-radius: 9px;
            padding: 10px 12px; background: white; color: var(--ink); font: inherit; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { outline: 3px solid #18745c25; border-color: var(--green); }
        .date-form input { width: auto; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 13px 20px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; background: #fbfcfb; }
        td { padding: 16px 20px; border-top: 1px solid var(--line); font-size: 14px; }
        .pet-name { font-weight: 700; }
        .secondary-text { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
        .status { display: inline-flex; padding: 5px 9px; border-radius: 99px; background: #fff4dc; color: #8b6417; font-size: 12px; font-weight: 700; }
        .status.atendida { background: #e6f5ec; color: #287348; }
        .status.cancelada { background: #fce9e7; color: #a3453b; }
        .empty { padding: 54px 24px; text-align: center; }
        .empty-icon { width: 52px; height: 52px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 16px; background: var(--mint); color: var(--green); font-size: 24px; }
        .empty h3 { margin: 0 0 7px; }
        .empty p { color: var(--muted); margin: 0; font-size: 14px; }
        .form-panel { max-width: 680px; padding: 28px; }
        .patient-summary { max-width: 680px; margin-bottom: 18px; padding: 20px 24px; }
        .patient-summary p { margin: 8px 0 0; line-height: 1.6; }
        .clinical-form { max-width: 680px; }
        .clinical-intro { margin-bottom: 22px; }
        .clinical-intro h2 { margin: 0 0 6px; font-size: 18px; }
        .clinical-intro p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
        .clinical-field { margin-top: 18px; }
        textarea { min-height: 132px; resize: vertical; line-height: 1.5; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 700; }
        .field-full { grid-column: 1 / -1; }
        .field .help { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
        .field-error { margin: 6px 0 0; color: #a3453b; font-size: 12px; }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; padding-top: 24px; margin-top: 24px; border-top: 1px solid var(--line); }
        .messages { margin-bottom: 20px; padding: 13px 16px; border: 1px solid #c8e7d3; border-radius: 10px; background: #edfaf1; color: #287348; font-size: 14px; }
        .error-banner { margin-bottom: 20px; padding: 13px 16px; border: 1px solid #f1c7c1; border-radius: 10px; background: #fff1ef; color: #a3453b; font-size: 14px; }
        @media (max-width: 640px) {
            .topbar-inner { padding: 0 16px; min-height: 64px; }
            .nav { gap: 12px; font-size: 12px; }
            main { padding: 30px 16px 48px; }
            .page-heading { align-items: flex-start; flex-direction: column; }
            .toolbar { align-items: flex-start; flex-direction: column; }
            .date-form { width: 100%; }
            .date-form input { flex: 1; min-width: 0; }
            .form-panel { padding: 20px; }
            .form-grid { grid-template-columns: 1fr; gap: 16px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="{% url 'agenda_diaria' %}">
                <span class="brand-mark" aria-hidden="true">✚</span>
                <span>Huellas Sanas<small>CLÍNICA VETERINARIA</small></span>
            </a>
            <nav class="nav" aria-label="Navegación principal">
                <a href="{% url 'agenda_diaria' %}" class="{% if request.resolver_match.url_name == 'agenda_diaria' %}active{% endif %}">Agenda</a>
                <a href="{% url 'nuevo_paciente' %}" class="{% if request.resolver_match.url_name == 'nuevo_paciente' %}active{% endif %}">Nuevo paciente</a>
            </nav>
        </div>
    </header>
    <main>
        {% if messages %}
            {% for message in messages %}<div class="messages" role="status">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
